# ============================================================
# docker-compose.yml — v3 Server 本地开发
# 只起基础设施 (PG + Redis), 业务由 Rust center daemon 直接跑
# ============================================================

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: javis
      POSTGRES_PASSWORD: javis
      POSTGRES_DB: javis
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U javis"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: