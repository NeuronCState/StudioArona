<html lang="zh-CN">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio Arona</title>
    <!-- API origins (Server + Agent + OCR) -->
    <link rel="preconnect" href="http://127.0.0.1:8080" />
    <link rel="preconnect" href="http://127.0.0.1:8081" />

    />

    <script src="/theme-button.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
