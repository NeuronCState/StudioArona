[package]
name = "studio-arona"
version = "0.1.0"
description = "Studio Arona - Smart Bulletin Board System"
authors = ["Studio Arona Team"]
license = "MIT"
repository = "https://github.com/studio-arona/studio-arona"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
log = "0.4"
anyhow = "1"
open = "5"
reqwest = { version = "0.12", features = ["json", "multipart"] }
libc = "0.2"
tokio = { version = "1", features = ["time", "rt"] }
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
