name: PR Pipeline

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # ── Python lint ─────────────────────────
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync
      - run: uv run ruff check services packages

  # ── TS lint (if frontend exists) ────────
  lint-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint

  # ── Spectral (OpenAPI lint) ─────────────
  lint-openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stoplightio/spectral-action@latest
        with:
          file_glob: packages/contracts/openapi.yaml

  # ── Python typecheck ────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync
      - run: uv run mypy services/api-gateway --ignore-missing-imports

  # ── Python unit tests (D) ─────────────────
  test-d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync
      - run: uv run pytest tests/D/unit/ -v --tb=short

  # ── Perception unit tests (C) ─────────────
  test-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync
      - run: uv run pytest tests/C/unit/ -v --tb=short

  # ── Agent unit tests ────────────────────
  test-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync
      - run: uv run pytest tests/B/ -v --tb=short

  # ── Docker build (no push) ──────────────
  build:
    runs-on: ubuntu-latest
    needs: [lint-python, typecheck, test-d]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api-gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api-gateway
          push: false
          tags: studio-javis/api-gateway:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.agent
          push: false
          tags: studio-javis/agent:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
