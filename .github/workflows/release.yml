name: Release Client Installers

# 全平台客户端安装包 — Tauri v2 desktop client
# 触发: 打 tag (v*) 自动跑; 也能手动 dispatch 测一下
# 产物: macOS (Apple Silicon + Intel) dmg/app + Windows msi/nsis + Linux deb/AppImage
# 不含 Server 端 (Server 走 docker compose, 不打桌面包)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # 创建 GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg,app
            bins: '**/bundle/macos/*.dmg **/bundle/macos/*.app'
          - label: macos-x64
            os: macos-13
            target: x86_64-apple-darwin
            bundle: dmg,app
            bins: '**/bundle/macos/*.dmg **/bundle/macos/*.app'
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi,nsis
            bins: '**/bundle/msi/*.msi **/bundle/nsis/*.exe'
          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,appimage
            bins: '**/bundle/deb/*.deb **/bundle/appimage/*.AppImage'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./Client/tauri -> target

      - name: Linux system deps (webkit2gtk-4.1 + gtk-3 + appindicator)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build client installers
        run: cd Client && pnpm install --frozen-lockfile && pnpm dlx @tauri-apps/cli@^2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --ci --no-sign

      - name: Upload installers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-${{ github.sha }}
          path: |
            Client/tauri/target/${{ matrix.target }}/release/${{ matrix.bins }}
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release with all installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: false
