name: Release Client Installers

# 全平台客户端安装包 — Tauri v2 desktop client
# 触发: 打 tag (v*) 自动跑; 也能手动 dispatch 测一下
# 产物: macOS (Apple Silicon + Intel) dmg + Windows msi + Linux deb
# 不含 Server 端 (Server 走 docker compose, 不打桌面包)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # 创建 GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
            bundle: app     # 只出 .app, dmg 我们自己造 (Tauri 的 dmg 含未签 .app)
          - label: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            arch: x64
            bundle: app     # 同上
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi
          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./Client/tauri -> target

      - name: Linux system deps (webkit2gtk-4.1 + gtk-3)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # v3.6.0 — Bundle SonettoHere Python runtime into the installer
      #
      # Tauri is just a UI shell; the actual agent runtime is SonettoHere
      # (LangGraph ReAct, 8081, port 8081), a separate Python FastAPI service.
      # To make the installer truly self-contained, we:
      #   1. Install uv + Python 3.12
      #   2. Create a venv from services/sonetto/requirements.txt + services/ocr/requirements.txt
      #   3. Strip __pycache__/dist-info and tarball it
      #   4. Tarball the SonettoHere source
      # Then tauri.conf.json `resources` embeds both tarballs into the
      # installer. The Tauri Rust code extracts them to `app_data_dir()/sonetto/`
      # on first launch and spawns the venv Python directly.
      - name: Install Python 3.12 + uv
        shell: bash
        run: |
          set -e
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv python install 3.12

      - name: Build SonettoHere venv + source tarballs
        shell: bash
        run: |
          set -e
          cd Client
          # Per-platform venv (Tauri is just a UI shell; venv must match OS/arch)
          uv venv --python 3.12 .venv-sonetto
          # Activate so subsequent `uv pip install` auto-targets this venv.
          # (Passing --python explicitly also works, but `source` is shorter and
          # is what the dev workflow uses.)
          # shellcheck disable=SC1091
          source .venv-sonetto/bin/activate
          # Linux/Windows venvs don't have bin/, so check after
          if [ ! -f ".venv-sonetto/bin/python3" ] && [ ! -f ".venv-sonetto/Scripts/python.exe" ]; then
            echo "ERROR: venv not created properly"
            exit 1
          fi
          # 3.12 deps for SonettoHere + OCR (kept in sync with services/sonetto/requirements.txt)
          uv pip install -r services/sonetto/requirements.txt
          uv pip install -r services/ocr/requirements.txt
          # Strip + tar (writes to Client/tauri/bundle/)
          bash tauri/bundle/build.sh

      - name: Build client installers
        run: cd Client && pnpm install --frozen-lockfile && pnpm dlx @tauri-apps/cli@^2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --ci --no-sign

      # macOS Gatekeeper workaround (v3.5.3).
      #
      # 三件事必须按顺序做:
      # 1. Tauri 2 release build 在 Mach-O 里嵌 linker signature (LC_CODE_SIGNATURE,
      #    flags=0x20000), `codesign --force` 不会自动剥, 残留让签名结构性失效
      #    ("code has no resources but signature indicates they must be present"),
      #    Gatekeeper 报"应用已损坏"。
      # 2. Tauri 的 `tauri build --bundles dmg` 在 build 完 .app 后立即把 .app 复制进
      #    .dmg, **不**等后续 sign step。所以直接 sign .app 对 dmg 里的副本无效,
      #    dmg 里那份永远是未签的。修法: Tauri 只出 .app (--bundles app), 我们自己
      #    用 hdiutil 拿签好的 .app 做 dmg。
      # 3. ad-hoc 签时显式 --identifier 跟 Info.plist 的 CFBundleIdentifier 对齐,
      #    不让 codesign 自动生成错的 Identifier (如 studio_arona-0048d4b40c66ccc9)。
      #
      # ad-hoc 不需要 Apple Developer 证书, 也不花钱。spctl --assess 一定 rejected
      # (无 Team ID), 但 `右键 → 打开` 能 bypass 启动。
      - name: Sign macOS .app + build signed .dmg
        if: matrix.os == 'macos-latest' || matrix.os == 'macos-14'
        run: |
          set -e
          APP_SRC=$(find Client/tauri/target/${{ matrix.target }}/release/bundle/macos -name "*.app" -type d | head -1)
          if [ -z "$APP_SRC" ]; then
            echo "ERROR: no .app found in Client/tauri/target/${{ matrix.target }}/release/bundle/macos"
            exit 1
          fi
          APP_NAME=$(basename "$APP_SRC")
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_SRC/Contents/Info.plist")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_SRC/Contents/Info.plist")
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_SRC/Contents/Info.plist")
          BINARY="$APP_SRC/Contents/MacOS/$EXEC_NAME"
          echo "App:    $APP_NAME"
          echo "Version: $VERSION"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Binary:  $BINARY"

          # 1) Strip linker signature
          if [ -f "$BINARY" ]; then
            codesign --remove-signature "$BINARY" || true
          fi

          # 2) Ad-hoc sign with explicit identifier
          codesign --force --deep --sign - --identifier "$BUNDLE_ID" "$APP_SRC"
          codesign --verify --deep --strict --verbose=2 "$APP_SRC"

          # 3) Verify post-sign: Identifier matches Bundle ID, no linker-signed flag,
          #    Sealed Resources present
          echo "--- post-sign codesign -dv ---"
          codesign -dv --verbose=2 "$APP_SRC"

          # 4) Build .dmg from the SIGNED .app (Tauri's .dmg has un-signed copy)
          STAGING=$(mktemp -d -t arona-dmg)
          cp -R "$APP_SRC" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          DMG_DIR="Client/tauri/target/${{ matrix.target }}/release/bundle/dmg"
          mkdir -p "$DMG_DIR"
          DMG_PATH="$DMG_DIR/Studio.Arona_${VERSION}_${{ matrix.arch }}.dmg"

          # Tauri uses dot-separated app name in dmg filename; mirror that for consistency
          hdiutil create \
            -volname "Studio Arona" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_PATH"

          rm -rf "$STAGING"

          # 5) Sign the .dmg
          codesign --force --sign - "$DMG_PATH"
          echo "--- post-build dmg ---"
          ls -la "$DMG_PATH"

      - name: Upload installers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-${{ github.sha }}
          path: |
            Client/tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            Client/tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            Client/tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release with all installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.deb
          body: |
            ## Studio Arona 3.6.0

            **真正的一键安装** — Tauri 桌面端不再依赖用户手动启 SonettoHere。

            ### 🎯 核心变更

            Tauri 之前只是个 UI shell, SonettoHere (LangGraph ReAct agent, 端口 8081) 是
            单独的 Python FastAPI 服务, 用户得手动 `cd Client && python3 run.py` 才能跑。
            这违背了"装好就能用"的基本盘。

            v3.6.0 把整套 Python runtime 塞进 dmg/msi/deb:

            1. **CI per-platform 构 venv** (macOS-Apple Silicon, macOS-Intel, Windows x64,
               Linux x64 各一份, 因为 Python venv 是 platform-specific 的, 没法跨平台)
            2. 剥掉 `__pycache__` + `.dist-info` 后打成 `venv.tar.gz` (~110MB, 主因
               langchain + pydantic + fastapi + 97 个工具库)
            3. SonettoHere 源码打成 `sonetto-source.tar.gz` (~100KB)
            4. Tauri `resources` 字段把两个 tarball 嵌进 installer
            5. **首次启动** 3-5s (M-series SSD) 解压到 `~/Library/Application Support/
               com.studioarona.desktop/sonetto/`, 之后秒开
            6. 后续启动直接 `python3 -m uvicorn api.server:create_app` 跑

            用户视角: 双击 dmg → 拖进 Applications → 打开 → 用。没有 Terminal, 没有
            `python3 run.py`, 没有"为啥 8081 不通"。

            ### 📦 安装包大小

            - macOS dmg: 之前 ~80MB → 现在 ~180-200MB (主要是 venv)
            - Windows msi / Linux deb: 同步膨胀
            - OCR 892M PaddleOCR-VL 模型**未打包** (懒下载机制不变, 不然 dmg 得上 GB)

            ### 🐛 之前的副作用

            - Tauri `--bundles app` + CI hdiutil 造 dmg 的流程 (v3.5.3 修的) 仍然有效
            - macOS 仍用 ad-hoc sign, 首次打开右键 → 打开

            ### 📋 v3.5.0-3.5.3 历史修复

            见各小版本 release notes。

            安装包由 GitHub Actions 自动构建, 完整产物见下方 Assets。
          generate_release_notes: false
          fail_on_unmatched_files: true
