name: Release Client Installers

# 全平台客户端安装包 — Tauri v2 desktop client
# 触发: 打 tag (v*) 自动跑; 也能手动 dispatch 测一下
# 产物: macOS (Apple Silicon + Intel) dmg + Windows msi + Linux deb
# 不含 Server 端 (Server 走 docker compose, 不打桌面包)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # 创建 GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - label: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            bundle: dmg
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi
          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./Client/tauri -> target

      - name: Linux system deps (webkit2gtk-4.1 + gtk-3)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build client installers
        run: cd Client && pnpm install --frozen-lockfile && pnpm dlx @tauri-apps/cli@^2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --ci --no-sign

      # macOS Gatekeeper workaround: Tauri 2 + --no-sign 出来的 .app / .dmg 是裸的,
      # macOS 14/15 直接报"应用已损坏"且右键→打开都救不了, 至少要 ad-hoc 签名才能走标准绕过流程.
      # ad-hoc 不需要 Apple Developer 证书, 也不花钱. --deep 递归签里面的 frameworks / dylibs.
      - name: Ad-hoc sign macOS .app + .dmg
        if: matrix.os == 'macos-latest' || matrix.os == 'macos-14'
        run: |
          find Client/tauri/target/${{ matrix.target }}/release/bundle/macos \
            -name "*.app" -type d \
            -exec codesign --force --deep --sign - {} \;
          find Client/tauri/target/${{ matrix.target }}/release/bundle/dmg \
            -name "*.dmg" \
            -exec codesign --force --sign - {} \;

      - name: Upload installers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-${{ github.sha }}
          path: |
            Client/tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            Client/tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            Client/tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release with all installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.deb
          body: |
            ## Studio Arona 3.5.1

            Patch release — 修复 macOS 安装问题。

            ### 🐛 修复

            - **macOS 安装报错** — Tauri 2 + `--no-sign` 出来的 `.app` 和 `.dmg` 是裸的,
              macOS 14/15 (尤其 Sequoia) 报"应用已损坏"且 `右键 → 打开` 救不了。
              CI 加一步 `codesign --force --deep --sign -` ad-hoc 签名 (无需 Apple Developer 证书),
              现在 dmg 挂载后双击 .app 能正常用"打开方式"绕过 Gatekeeper。

            ### 📦 安装包 (继承自 3.5.0)

            | 平台 | 格式 | 架构 |
            |---|---|---|
            | macOS | `.dmg` | Apple Silicon + Intel |
            | Windows | `.msi` | x64 |
            | Linux | `.deb` | x64 |

            ### 📋 3.5.0 完整更新日志

            **新功能**:
            - 拷入完整 Live2D / Spine / draco 资产 (303 文件, ~75 MB)
            - Server TUI 面板 (`server-tui.py` 用 rich 库)
            - 设备发现 + Arona 风格 Home 页面 (`HomeCommandPage` 4 入口 + 同步时间线 mock)
            - OCR 服务去重, 统一入口

            **修复**:
            - `server-tui.py` 自动加载 `.venv-runner` rich 库
            - Tauri `infoPlist` 改为文件路径引用, 修复打包问题

            安装包由 GitHub Actions 自动构建, 完整产物见下方 Assets。
          generate_release_notes: false
          fail_on_unmatched_files: true
