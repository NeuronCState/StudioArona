name: Release Client Installers

# 全平台客户端安装包 — Tauri v2 desktop client
# 触发: 打 tag (v*) 自动跑; 也能手动 dispatch 测一下
# 产物: macOS (Apple Silicon + Intel) dmg + Windows msi + Linux deb
# 不含 Server 端 (Server 走 docker compose, 不打桌面包)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # 创建 GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
          - label: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            bundle: dmg
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi
          - label: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./Client/tauri -> target

      - name: Linux system deps (webkit2gtk-4.1 + gtk-3)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build client installers
        run: cd Client && pnpm install --frozen-lockfile && pnpm dlx @tauri-apps/cli@^2 build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --ci --no-sign

      - name: Upload installers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-${{ github.sha }}
          path: |
            Client/tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            Client/tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            Client/tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release with all installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.deb
          body: |
            ## Studio Arona 3.5.0

            本次发布的核心改动 — Arona 模式资产就位 + Server 体验打磨。

            ### ✨ 新功能

            - **Arona 模式资产就位** — 拷入完整 Live2D / Spine / draco 资产 (303 个文件, ~75 MB)
              - Live2D arona 模型: moc3 / physics3 / cdi3 / 全部 expressions + motions
              - Spine arona / plana / workpage 模型: skel + atlas + png
              - draco 解码器: decoder.wasm + 完整 wrapper
              - 互动壁纸 CNAronaPlana: index.html / js / css / lib / project.json
            - **Server TUI 面板** — `server-tui.py` 重写, 用 rich 库做设备发现 / 状态总览
            - **设备发现** — Server 启动时扫描局域网内的 Studio Arona 实例
            - **Home 页面重构** — Arona 风格 home (`HomeCommandPage`) 入仓, 6 入口 + 同步时间线
            - **OCR 服务去重** — 移除 `Server/services/ocr/` 重复实现, 统一入口

            ### 🐛 修复

            - `server-tui.py` 自动加载 `.venv-runner` 中的 rich 库
            - Tauri `infoPlist` 改为文件路径引用, 修复打包问题

            ### 📦 安装包

            | 平台 | 格式 | 架构 |
            |---|---|---|
            | macOS | `.dmg` | Apple Silicon + Intel |
            | Windows | `.msi` | x64 |
            | Linux | `.deb` | x64 |

            安装包由 GitHub Actions 自动构建, 完整产物见下方 Assets。
          generate_release_notes: false
          fail_on_unmatched_files: true
