# ============================================================
# docker-compose.prod-nogpu.yml
# Overlay for production servers WITHOUT GPU / camera / serial.
#
# Usage:
#   docker compose \
#     -f infra/compose/docker-compose.prod.yml \
#     -f infra/compose/docker-compose.prod-nogpu.yml \
#     up -d
# ============================================================

services:
  perception:
    # Remove hardware device mappings (no camera, no serial port)
    devices: []
    # Remove GPU reservation
    deploy: {}
    environment:
      PERCEPTION_PLATFORM: linux
      PERCEPTION_CAMERA_DEVICE: mock
      PERCEPTION_SERIAL_PORT: mock
      PERCEPTION_VM_BACKEND: mock
      MOCK_NAS: "true"
      MOCK_HA: "true"
      MOCK_VM: "true"
      MOCK_HARDWARE: "true"
      MOCK_SERIAL: "true"
