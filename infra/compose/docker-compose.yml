# ============================================================
# docker-compose.yml — Mac 本地开发
# 特点：bind mount 热重载 + .env.local
# 注意：perception 在 Mac 阶段用 host 进程（摄像头不进容器）
# ============================================================

services:
  # --- 基础设施 ---
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: javis
      POSTGRES_PASSWORD: javis
      POSTGRES_DB: javis
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U javis"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- 网关（bind mount + 跑迁移）---
  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api-gateway
    env_file: ../../.env.local
    environment:
      SERVICE_NAME: api-gateway
      RUN_MIGRATIONS: "true"
      WAIT_PG_HOST: postgres
      WAIT_REDIS_HOST: redis
    volumes:
      - ../../services/api-gateway:/app
      - ../../packages/contracts:/app/packages/contracts
    ports:
      - "8080:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # --- Agent（bind mount，无迁移）---
  agent:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.agent
    env_file: ../../.env.local
    environment:
      SERVICE_NAME: agent
      WAIT_PG_HOST: postgres
      WAIT_REDIS_HOST: redis
    volumes:
      - ../../services/agent:/app
      - ../../packages/skills:/app/packages/skills
      - ../../packages/contracts:/app/packages/contracts
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # --- Perception（Mac 阶段默认不启容器，C 用 host 进程）---
  perception:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.perception
    env_file: ../../.env.local
    environment:
      SERVICE_NAME: perception
      WAIT_PG_HOST: postgres
      WAIT_REDIS_HOST: redis
    volumes:
      - ../../services/perception:/app
      - ../../packages/skills:/app/packages/skills
      - ../../packages/contracts:/app/packages/contracts
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    profiles: [full]

  # --- 前端（开发用 vite dev server，不进容器）---
  # web:
  #   build:
  #     context: ../..
  #     dockerfile: infra/docker/Dockerfile.web
  #   ports:
  #     - "5173:80"
  #   profiles: [full]
  #   # Mac 开发阶段不走容器，用 pnpm dev

volumes:
  pgdata:
