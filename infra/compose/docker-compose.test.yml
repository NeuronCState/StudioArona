# ============================================================
# docker-compose.test.yml — CI + 集成测试
# 端口隔离：PG 5433 / Redis 6380 / API 8081
# 无 bind mount，代码走镜像；用完即弃
# ============================================================

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: javis
      POSTGRES_PASSWORD: javis
      POSTGRES_DB: javis_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U javis"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api-gateway
    env_file: ../../.env.test
    environment:
      SERVICE_NAME: api-gateway
      RUN_MIGRATIONS: "true"
      WAIT_PG_HOST: postgres
      WAIT_REDIS_HOST: redis
      APP_ENV: test
    ports:
      - "8081:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  agent:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.agent
    env_file: ../../.env.test
    environment:
      SERVICE_NAME: agent
      WAIT_PG_HOST: postgres
      WAIT_REDIS_HOST: redis
      APP_ENV: test
      LLM_PROVIDER: mock
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  perception:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.perception
    env_file: ../../.env.test
    environment:
      SERVICE_NAME: perception
      WAIT_PG_HOST: postgres
      WAIT_REDIS_HOST: redis
      APP_ENV: test
      PERCEPTION_CAMERA_DEVICE: mock
      PERCEPTION_SERIAL_PORT: mock
      PERCEPTION_VM_BACKEND: mock
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
