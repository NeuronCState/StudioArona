# ============================================================
# docker-compose.prod.yml — Linux 生产环境
# 无 bind mount / 无 dev env / 全镜像自包含
# 前端由 Nginx 容器 serve，perception 可直通摄像头
# ============================================================

services:
  # --- 基础设施 ---
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER:-javis}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB:-javis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U javis"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # --- 网关 ---
  api-gateway:
    image: studio-arona/api-gateway:${IMAGE_TAG:-latest}
    env_file: .env.production
    environment:
      SERVICE_NAME: api-gateway
      RUN_MIGRATIONS: "true"
      WAIT_PG_HOST: postgres
      WAIT_REDIS_HOST: redis
      APP_ENV: production
      LOG_LEVEL: info
      AGENT_URL: http://agent:8000
      PERCEPTION_URL: http://perception:8000
    expose:
      - "8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # --- Agent (Node.js bridge server) ---
  agent:
    image: studio-arona/agent:${IMAGE_TAG:-latest}
    env_file: .env.production
    environment:
      SERVICE_NAME: agent
      BRIDGE_PORT: "8000"
      DATABASE_URL: postgresql://javis:javis@postgres:5432/javis
      WAIT_PG_HOST: postgres
      WAIT_REDIS_HOST: redis
      APP_ENV: production
      LOG_LEVEL: info
    expose:
      - "8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # --- Perception ---
  perception:
    image: studio-arona/perception:${IMAGE_TAG:-latest}
    env_file: .env.production
    environment:
      SERVICE_NAME: perception
      WAIT_PG_HOST: postgres
      WAIT_REDIS_HOST: redis
      APP_ENV: production
      LOG_LEVEL: info
    devices:
      - /dev/video0:/dev/video0
      - /dev/ttyUSB0:/dev/ttyUSB0
    expose:
      - "8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # --- 前端 Nginx ---
  web:
    image: studio-arona/web:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-gateway
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  pgdata:
  redis_data:
