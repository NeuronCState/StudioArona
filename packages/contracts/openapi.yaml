openapi: "3.1.0"
info:
  title: Studio Arona API
  version: "0.2.0"
  description: 工作室贾维斯 API 契约 — Phase 5 数据真实化版

servers:
  - url: http://localhost:8080
    description: Mac 本地开发

paths:
  # ── Auth ─────────────────────────────────
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 用户名密码登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, user]
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: 刷新 access token
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                type: object
                required: [access_token]
                properties:
                  access_token: { type: string }

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 注销
      responses:
        "204":
          description: 已注销

  # ── User ─────────────────────────────────
  /api/me:
    get:
      tags: [User]
      operationId: getMe
      summary: 当前用户信息 + 偏好
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /api/me/preferences:
    patch:
      tags: [User]
      operationId: updatePreferences
      summary: 更新个人偏好
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key: { type: string }
                value: {}
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /api/users:
    get:
      tags: [User]
      operationId: listUsers
      summary: 工作室成员列表（admin）
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  # ── Chat ─────────────────────────────────
  /api/chat/sessions:
    post:
      tags: [Chat]
      operationId: createSession
      summary: 创建新对话
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"

  /api/chat/sessions/{sessionId}/messages:
    get:
      tags: [Chat]
      operationId: getMessages
      summary: 历史消息
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      tags: [Chat]
      operationId: streamMessage
      summary: SSE 流式对话
      description: 响应为 text/event-stream
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        "200":
          description: SSE 事件流
          content:
            text/event-stream: {}

  # ── Schedules ────────────────────────────
  /api/schedules:
    get:
      tags: [Schedules]
      operationId: listSchedules
      summary: 日程列表（当前用户）
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
    post:
      tags: [Schedules]
      operationId: createSchedule
      summary: 创建日程
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, starts_at]
              properties:
                title: { type: string }
                body: { type: string }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                rrule: { type: string }
                reminder_min: { type: integer }
                status: { type: string, default: "pending" }
                source: { type: string, default: "manual" }
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"

  /api/schedules/{scheduleId}:
    patch:
      tags: [Schedules]
      operationId: updateSchedule
      summary: 更新日程
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                body: { type: string }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                rrule: { type: string }
                reminder_min: { type: integer }
                status: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
    delete:
      tags: [Schedules]
      operationId: deleteSchedule
      summary: 删除日程
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: 已删除 }

  # ── Feeds ────────────────────────────────
  /api/feeds:
    get:
      tags: [Feeds]
      operationId: listFeeds
      summary: RSS 订阅源列表（当前用户）
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feed"
    post:
      tags: [Feeds]
      operationId: createFeed
      summary: 添加 RSS 订阅
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                title: { type: string }
                category: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"

  /api/feeds/{feedId}:
    get:
      tags: [Feeds]
      operationId: getFeed
      summary: 单个订阅源详情
      parameters:
        - name: feedId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
    delete:
      tags: [Feeds]
      operationId: deleteFeed
      summary: 删除订阅源
      parameters:
        - name: feedId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: 已删除 }

  /api/feeds/{feedId}/items:
    get:
      tags: [Feeds]
      operationId: listFeedItems
      summary: 订阅源文章列表
      parameters:
        - name: feedId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedItem"

  /api/feeds/items/{itemId}/read:
    post:
      tags: [Feeds]
      operationId: markFeedItemRead
      summary: 标记已读
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                read: { type: boolean, default: true }
      responses:
        "200": { description: 已更新 }

  /api/feeds/items/{itemId}/star:
    post:
      tags: [Feeds]
      operationId: toggleFeedItemStar
      summary: 切换收藏
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                starred: { type: boolean, default: true }
      responses:
        "200": { description: 已更新 }

  # ── Memory ───────────────────────────────
  /api/memory/entries:
    get:
      tags: [Memory]
      operationId: listMemoryEntries
      summary: 记忆列表（当前用户）
      parameters:
        - name: kind
          in: query
          schema: { type: string }
        - name: tag
          in: query
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemoryEntry"
    post:
      tags: [Memory]
      operationId: createMemoryEntry
      summary: 写入记忆
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, content]
              properties:
                kind: { type: string }
                content: { type: string }
                tags: { type: array, items: { type: string } }
                weight: { type: number, default: 1.0 }
                expires_at: { type: string, format: date-time }
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"

  /api/memory/entries/{entryId}:
    get:
      tags: [Memory]
      operationId: getMemoryEntry
      summary: 获取单条记忆
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEntry"
    delete:
      tags: [Memory]
      operationId: deleteMemoryEntry
      summary: 删除记忆
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: 已删除 }

  # ── System ───────────────────────────────
  /api/system/status:
    get:
      tags: [System]
      operationId: getSystemStatus
      summary: 系统状态概览（聚合 cpu/mem/disk/gpu + 在线设备数 + VM 数）
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"

  /api/system/metrics:
    get:
      tags: [System]
      operationId: getMetrics
      summary: 硬件监控快照
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemMetrics"

  # ── VMs ──────────────────────────────────
  /api/vms:
    get:
      tags: [VMs]
      operationId: listVMs
      summary: 虚拟机列表（当前用户）
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VM"
    post:
      tags: [VMs]
      operationId: createVM
      summary: 注册虚拟机
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, hypervisor]
              properties:
                name: { type: string }
                hypervisor: { type: string, enum: [libvirt, vbox, mock] }
                spec_cpu: { type: integer, minimum: 1 }
                spec_ram_mb: { type: integer, minimum: 512 }
                spec_disk_gb: { type: integer, minimum: 1 }
                ip: { type: string }
                notes: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"

  /api/vms/{vmId}:
    delete:
      tags: [VMs]
      operationId: deleteVM
      summary: 删除虚拟机
      parameters:
        - name: vmId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: 已删除 }

  /api/vms/{vmId}/start:
    post:
      tags: [VMs]
      operationId: startVM
      summary: 启动虚拟机
      parameters:
        - name: vmId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"

  /api/vms/{vmId}/stop:
    post:
      tags: [VMs]
      operationId: stopVM
      summary: 停止虚拟机
      parameters:
        - name: vmId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"

  /api/vms/{vmId}/console:
    get:
      tags: [VMs]
      operationId: readVMConsole
      summary: 读取 VM 串口日志末尾
      parameters:
        - name: vmId
          in: path
          required: true
          schema: { type: string }
        - name: lines
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [vm_id, lines]
                properties:
                  vm_id: { type: string }
                  lines: { type: string }
                  truncated: { type: boolean }

  /api/vms/{vmId}/exec_enable:
    post:
      tags: [VMs]
      operationId: toggleVMExec
      summary: 开关此 VM 的 exec 权限
      parameters:
        - name: vmId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VM"

  # ── Network ──────────────────────────────
  /api/network/devices:
    get:
      tags: [Network]
      operationId: listNetworkDevices
      summary: 局域网设备列表
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NetworkDevice"

  # ── Assets ───────────────────────────────
  /api/assets/live2d/arona/manifest.json:
    get:
      tags: [Assets]
      operationId: getAronaManifest
      summary: 阿罗娜 Live2D 资源清单
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  modelPath: { type: string }
                  expressions: { type: object, additionalProperties: { type: string } }
                  motions: { type: object, additionalProperties: { type: array, items: { type: string } } }

  /api/assets/live2d/arona/{path}:
    get:
      tags: [Assets]
      operationId: serveAronaAsset
      summary: 阿罗娜 Live2D 静态资产
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 资产文件
          headers:
            Cache-Control:
              schema: { type: string }
              description: max-age=86400

  /api/assets/scenes/{path}:
    get:
      tags: [Assets]
      operationId: serveSceneAsset
      summary: 3D 场景 .glb 资产
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string, pattern: '.*\.(glb|gltf|bin|png|jpg|hdr)$' }
      responses:
        "200":
          description: 场景资产文件
          headers:
            Cache-Control:
              schema: { type: string }
              description: max-age=86400

# ── Components ─────────────────────────────
components:
  schemas:
    User:
      type: object
      required: [id, username, display_name, role, created_at]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [admin, member] }
        created_at: { type: string, format: date-time }

    UserProfile:
      type: object
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [preferences, face_enrolled]
          properties:
            preferences: { type: object, additionalProperties: true }
            face_enrolled: { type: boolean }

    ChatSession:
      type: object
      required: [id, user_id, created_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        title: { type: string }
        mode: { type: string, enum: [text, voice] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }

    ChatMessage:
      type: object
      required: [id, session_id, role, content, created_at]
      properties:
        id: { type: string }
        session_id: { type: string }
        role: { type: string, enum: [user, assistant, tool] }
        content: { type: string }
        tool_calls: { type: array, items: { type: object, additionalProperties: true } }
        created_at: { type: string, format: date-time }

    Schedule:
      type: object
      required: [id, user_id, title, starts_at, status, source, created_at, updated_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        title: { type: string }
        body: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        rrule: { type: string }
        reminder_min: { type: integer }
        status: { type: string, enum: [pending, done, cancelled] }
        source: { type: string, enum: [manual, agent, rss, ha] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Feed:
      type: object
      required: [id, user_id, url, enabled, created_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        url: { type: string, format: uri }
        title: { type: string }
        category: { type: string }
        enabled: { type: boolean }
        last_fetched_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    FeedItem:
      type: object
      required: [id, feed_id, guid, title, read, starred, fetched_at]
      properties:
        id: { type: string }
        feed_id: { type: string }
        guid: { type: string }
        title: { type: string }
        link: { type: string }
        summary: { type: string }
        published_at: { type: string, format: date-time }
        read: { type: boolean }
        starred: { type: boolean }
        fetched_at: { type: string, format: date-time }

    MemoryEntry:
      type: object
      required: [id, user_id, kind, content, weight, created_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        kind: { type: string }
        content: { type: string }
        tags: { type: array, items: { type: string } }
        source_msg_id: { type: string }
        weight: { type: number }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    SystemStatus:
      type: object
      required: [ts, cpu_pct, mem_pct, disk_pct, gpu_count, vm_count, online_devices]
      properties:
        ts: { type: string, format: date-time }
        cpu_pct: { type: number }
        mem_pct: { type: number }
        disk_pct: { type: number }
        gpu_count: { type: integer }
        vm_count: { type: integer }
        online_devices: { type: integer }

    GpuProcess:
      type: object
      required: [pid, name, user, gpu_mem_mb]
      properties:
        pid: { type: integer }
        name: { type: string }
        user: { type: string }
        gpu_mem_mb: { type: integer }

    GPU:
      type: object
      required: [name, mem_total_mb, mem_used_mb, util_pct, temp_c, processes]
      properties:
        name: { type: string }
        mem_total_mb: { type: integer }
        mem_used_mb: { type: integer }
        util_pct: { type: number }
        temp_c: { type: number }
        processes: { type: array, items: { $ref: "#/components/schemas/GpuProcess" } }

    CPUCore:
      type: object
      required: [index, util_pct, freq_mhz]
      properties:
        index: { type: integer }
        util_pct: { type: number }
        freq_mhz: { type: number }

    DiskUsage:
      type: object
      required: [mount, total_gb, used_gb, util_pct]
      properties:
        mount: { type: string }
        total_gb: { type: number }
        used_gb: { type: number }
        util_pct: { type: number }

    TrainingJob:
      type: object
      required: [id, user, name, status, gpu_util_pct, current_step, elapsed_h]
      properties:
        id: { type: string }
        user: { type: string }
        name: { type: string }
        status: { type: string, enum: [running, paused, done, error] }
        gpu_util_pct: { type: number }
        current_step: { type: integer }
        total_steps: { type: integer, nullable: true }
        elapsed_h: { type: number }
        eta_h: { type: number, nullable: true }

    SystemMetrics:
      type: object
      required: [ts, cpu_cores, mem_total_mb, mem_used_mb, disks, gpus, training_jobs]
      properties:
        ts: { type: string, format: date-time }
        cpu_cores: { type: array, items: { $ref: "#/components/schemas/CPUCore" } }
        mem_total_mb: { type: integer }
        mem_used_mb: { type: integer }
        disks: { type: array, items: { $ref: "#/components/schemas/DiskUsage" } }
        gpus: { type: array, items: { $ref: "#/components/schemas/GPU" } }
        training_jobs: { type: array, items: { $ref: "#/components/schemas/TrainingJob" } }

    VM:
      type: object
      required: [id, user_id, name, hypervisor, status, guest_agent_ok, exec_enabled, created_at]
      properties:
        id: { type: string }
        user_id: { type: string }
        name: { type: string }
        hypervisor: { type: string, enum: [libvirt, vbox, mock] }
        spec_cpu: { type: integer }
        spec_ram_mb: { type: integer }
        spec_disk_gb: { type: integer }
        status: { type: string, enum: [queued, creating, running, stopped, error, destroyed] }
        ip: { type: string }
        notes: { type: string }
        console_path: { type: string }
        guest_agent_ok: { type: boolean }
        exec_enabled: { type: boolean }
        created_at: { type: string, format: date-time }

    NetworkDevice:
      type: object
      required: [ip, mac, hostname, vendor, online, last_seen]
      properties:
        ip: { type: string }
        mac: { type: string }
        hostname: { type: string }
        vendor: { type: string }
        online: { type: boolean }
        last_seen: { type: string, format: date-time }

    Error:
      type: object
      required: [code, message, trace_id]
      properties:
        code: { type: string }
        message: { type: string }
        trace_id: { type: string }

  responses:
    Unauthorized:
      description: 未认证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
