[project]
name = "perception"
version = "0.1.0"
description = "Studio Arona Perception Service — 人脸识别、外设抽象、硬件监控"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "structlog>=24.4",
    "psutil>=6.1",
    "opencv-python>=4.10",
    "numpy>=2.0",
    "ultralytics>=8.3",
    "insightface>=0.7",
    "onnxruntime>=1.18",
    "funasr>=1.0",
    "modelscope>=1.18",
    "soundfile>=0.12",
    "torchaudio>=2.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.28",
    "ruff>=0.5",
    "mypy>=1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
